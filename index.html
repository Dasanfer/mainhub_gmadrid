<title>Hub Central de Gestión - GMadrid Juegos de Mesa</title>

<style>
:root {
    --primary: #0078d4;
    --primary-dark: #005a9e;
    --card-bg: rgba(255, 255, 255, 0.92);
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: rgba(226, 232, 240, 0.8);
    --radius: 14px;
}

/* BLOQUEO TOTAL DE SCROLL */
html, body {
    width: 100%;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* CONTENEDOR DE ELEMENTOS FLOTANTES (EMOTES LANZADOS) */
#floating-games-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -3;
    pointer-events: none;
}

.floating-game-item {
    position: absolute;
    font-size: 24px;
    opacity: 0.35;
    user-select: none;
    will-change: transform, opacity;
}

@keyframes lanzarDeLadoALado {
    0% {
        transform: translate(var(--start-x), var(--start-y)) rotate(0deg) scale(0.8);
        opacity: 0;
    }
    10% { opacity: 0.45; }
    90% { opacity: 0.45; }
    100% {
        transform: translate(var(--end-x), var(--end-y)) rotate(var(--rotacion)) scale(1.1);
        opacity: 0;
    }
}

/* FONDO ANIMADO CON DEGRADADO ARCOÍRIS GENERAL */
@keyframes bgArcoiris {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(228, 3, 3, 0.14), rgba(255, 140, 0, 0.14), rgba(255, 237, 0, 0.14), rgba(0, 128, 38, 0.14), rgba(0, 68, 212, 0.14), rgba(117, 0, 135, 0.14));
    background-size: 400% 400%;
    z-index: -2;
    animation: bgArcoiris 15s ease infinite;
}

/* ESQUINA SUPERIOR DERECHA CON ARCOÍRIS DINÁMICO */
@keyframes esquinaArcoiris1 {
    0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
    50% { transform: scale(1.15) rotate(180deg); opacity: 0.85; }
    100% { transform: scale(1) rotate(360deg); opacity: 0.6; }
}

body::after {
    content: '';
    position: absolute;
    top: -80px;
    right: -80px;
    width: 280px;
    height: 280px;
    background: linear-gradient(135deg, #e40303, #ff8c00, #ffed00, #008026, #0044d4, #750087);
    border-radius: 50%;
    z-index: -1;
    filter: blur(45px);
    pointer-events: none;
    animation: esquinaArcoiris1 10s ease-in-out infinite;
}

/* ESQUINA INFERIOR IZQUIERDA CON ARCOÍRIS DINÁMICO (OPUESTA) */
@keyframes esquinaArcoiris2 {
    0% { transform: scale(1.15) rotate(360deg); opacity: 0.85; }
    50% { transform: scale(1) rotate(180deg); opacity: 0.6; }
    100% { transform: scale(1.15) rotate(0deg); opacity: 0.85; }
}

.esquina-opuesta-bg {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 280px;
    height: 280px;
    background: linear-gradient(135deg, #750087, #0044d4, #008026, #ffed00, #ff8c00, #e40303);
    border-radius: 50%;
    z-index: -1;
    filter: blur(45px);
    pointer-events: none;
    animation: esquinaArcoiris2 10s ease-in-out infinite;
}

.hub-container {
    width: 100%;
    max-width: 540px;
    max-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    overflow: hidden;
}

/* PERFIL / CABECERA */
.hub-profile {
    text-align: center;
    margin-bottom: 25px;
    opacity: 0;
    animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* AVATAR DADO CON DEGRADADO ARCOÍRIS Y EFECTO FLOTANTE */
@keyframes dadoArcoiris {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes flotar {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
}

.hub-avatar {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #e40303, #ff8c00, #ffed00, #008026, #0044d4, #750087);
    background-size: 300% 300%;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 12px auto;
    box-shadow: 0 8px 25px rgba(117, 0, 135, 0.3);
    font-size: 34px;
    animation: dadoArcoiris 8s ease infinite, flotar 4s ease-in-out infinite;
}

.hub-profile h1 {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-main);
    margin: 0 0 4px 0;
    letter-spacing: -0.3px;
}

.hub-profile p {
    font-size: 13.5px;
    color: #750087;
    margin: 0 0 10px 0;
    display: inline-block;
    background: rgba(117, 0, 135, 0.08);
    padding: 5px 14px;
    border-radius: 20px;
    font-weight: 600;
}

.hub-profile blockquote {
    margin: 8px auto 0 auto;
    font-size: 13px;
    font-style: italic;
    color: var(--text-muted);
    max-width: 480px;
    line-height: 1.4;
    border-left: 3px solid #750087;
    padding-left: 10px;
    background: rgba(117, 0, 135, 0.03);
    border-radius: 0 8px 8px 0;
    padding-top: 4px;
    padding-bottom: 4px;
}

/* LISTA DE ENLACES */
.hub-links-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
    overflow: hidden;
}

/* ANIMACIONES LATERALES DE ENTRADA CON RASTRO DE ARCOÍRIS */
@keyframes entrarIzquierdaConRastro {
    0% { opacity: 0; transform: translateX(-100vw); box-shadow: -20px 0 30px rgba(228, 3, 3, 0.6), -10px 0 15px rgba(0, 68, 212, 0.4); }
    60% { opacity: 1; box-shadow: -10px 0 20px rgba(255, 140, 0, 0.5), -5px 0 10px rgba(0, 128, 38, 0.3); }
    100% { opacity: 1; transform: translateX(0); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); }
}

@keyframes entrarDerechaConRastro {
    0% { opacity: 0; transform: translateX(100vw); box-shadow: 20px 0 30px rgba(117, 0, 135, 0.6), 10px 0 15px rgba(255, 237, 0, 0.4); }
    60% { opacity: 1; box-shadow: 10px 0 20px rgba(0, 68, 212, 0.5), 5px 0 10px rgba(255, 140, 0, 0.3); }
    100% { opacity: 1; transform: translateX(0); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); }
}

@keyframes bordeArcoirisMovil {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
}

.hub-link-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 15px 20px;
    text-decoration: none;
    color: var(--text-main);
    font-weight: 600;
    font-size: 14.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
    opacity: 0;
}

/* ASIGNACIÓN DE ENTRADA LATERAL */
.hub-link-card:nth-child(odd) {
    animation: entrarIzquierdaConRastro 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.hub-link-card:nth-child(even) {
    animation: entrarDerechaConRastro 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.hub-link-card:nth-child(1) { animation-delay: 0.1s; }
.hub-link-card:nth-child(2) { animation-delay: 0.2s; }
.hub-link-card:nth-child(3) { animation-delay: 0.3s; }
.hub-link-card:nth-child(4) { animation-delay: 0.4s; }

.hub-link-card:not(.proximamente):active {
    transform: scale(0.97) !important;
}

@keyframes brilloDestello {
    0% { transform: translateX(-100%) rotate(25deg); }
    100% { transform: translateX(200%) rotate(25deg); }
}

.hub-link-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0));
    pointer-events: none;
}

.hub-link-card:not(.proximamente):hover::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 50%;
    height: 200%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
    opacity: 1;
    pointer-events: none;
    animation: brilloDestello 0.75s ease-in-out;
}

.hub-link-card .rainbow-bar {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 5px;
    background: linear-gradient(to bottom, #e40303, #ff8c00, #ffed00, #008026, #0044d4, #750087);
    background-size: 100% 300%;
    animation: bordeArcoirisMovil 4s linear infinite;
}

.hub-link-card:not(.proximamente):hover {
    transform: translateY(-2px);
    border: 1px solid transparent;
    background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(135deg, #e40303, #ff8c00, #ffed00, #008026, #0044d4, #750087);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 12px 30px rgba(117, 0, 135, 0.25);
}

.link-content {
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1;
}

.link-icon {
    font-size: 18px;
    width: 32px;
    height: 32px;
    background: rgba(241, 245, 249, 0.9);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
}

.hub-link-card:not(.proximamente):hover .link-icon {
    background: rgba(117, 0, 135, 0.12);
    transform: scale(1.1) rotate(5deg);
}

.link-arrow {
    color: var(--text-muted);
    font-size: 15px;
    transition: transform 0.2s, color 0.2s;
    z-index: 1;
}

.hub-link-card:not(.proximamente):hover .link-arrow {
    transform: translateX(3px);
    color: #750087;
}

.hub-link-card.proximamente {
    cursor: not-allowed;
}

.hub-link-card.proximamente:hover {
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
}

@keyframes pulsoArcoiris {
    0% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.04); filter: brightness(1.15); }
    100% { transform: scale(1); filter: brightness(1); }
}

.badge-proximamente {
    background: linear-gradient(135deg, #e40303, #ff8c00, #ffed00, #008026, #0044d4, #750087);
    background-size: 300% 300%;
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.3px;
    box-shadow: 0 2px 8px rgba(117, 0, 135, 0.25);
    animation: bgArcoiris 6s ease infinite, pulsoArcoiris 2.5s ease-in-out infinite;
}

/* PIE DE PÁGINA */
.hub-footer {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.5));
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(117, 0, 135, 0.15);
    padding: 12px 16px;
    border-radius: 20px;
    text-align: center;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(117, 0, 135, 0.05);
    opacity: 0;
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.hub-footer p {
    margin: 0;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    line-height: 1.4;
}

#fechaHoy {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: 0 0 6px 0;
    font-weight: 500;
}
</style>
</head>
<body>

<!-- Contenedor para los emotes de juegos lanzados al fondo -->
<div id="floating-games-container"></div>

<!-- Elementos decorativos para las esquinas -->
<div class="esquina-opuesta-bg"></div>

<div class="hub-container">

    <!-- CABECERA Y PERFIL -->
    <header class="hub-profile">
        <div class="hub-avatar">🎲</div>
        <h1>GMadrid Juegos de Mesa</h1>
        <p>Panel Principal de Herramientas y Gestión 🏳️‍🌈</p>
        <blockquote id="fraseDinamica"></blockquote>
    </header>

    <!-- LISTA DE ENLACES PRINCIPALES -->
    <main class="hub-links-list">
        
        <!-- 1. Control de Asistencia (Activo) -->
        <a href="https://dasanfer.github.io/asistencia_gmadrid/" class="hub-link-card" target="_blank" rel="noopener noreferrer">
            <div class="rainbow-bar"></div>
            <div class="link-content">
                <span class="link-icon">📊</span>
                <span>Control de Asistencia</span>
            </div>
            <span class="link-arrow">➔</span>
        </a>

        <!-- 2. Sistema de Fichaje (Activo) -->
        <a href="https://dasanfer.github.io/fichaje_gmadrid/" class="hub-link-card" target="_blank" rel="noopener noreferrer">
            <div class="rainbow-bar"></div>
            <div class="link-content">
                <span class="link-icon">⏱️</span>
                <span>Sistema de Fichaje</span>
            </div>
            <span class="link-arrow">➔</span>
        </a>

        <!-- 3. Gestión Erasmus (Próximamente) -->
        <a href="#" class="hub-link-card proximamente" onclick="return false;">
            <div class="rainbow-bar"></div>
            <div class="link-content">
                <span class="link-icon">✈️</span>
                <span>Gestión Erasmus</span>
            </div>
            <span class="badge-proximamente">PRÓXIMAMENTE</span>
        </a>

        <!-- 4. Propuesta de Juegos (Próximamente) -->
        <a href="#" class="hub-link-card proximamente" onclick="return false;">
            <div class="rainbow-bar"></div>
            <div class="link-content">
                <span class="link-icon">♟️</span>
                <span>Propuesta de Juegos</span>
            </div>
            <span class="badge-proximamente">PRÓXIMAMENTE</span>
        </a>

    </main>

    <!-- FOOTER INFORMATIVO CON RELOJ Y CONTACTO -->
    <footer class="hub-footer">
        <p id="fechaHoy"></p>
        <p>💬 ¿Tienes algún problema, duda o sugerencia? Contacta con <b>Daniel Sánchez</b></p>
    </footer>

</div>

<script>
const frasesJuegos = [
    "No importa quién seas ni de dónde vengas; en esta mesa todos compartimos las mismas reglas.",
    "La única estrategia obligatoria aquí es que nadie se quede fuera de la partida.",
    "Un buen tablero no entiende de etiquetas, solo de dados y ganas de pasarlo bien.",
    "Aquí venimos a tirar dados, romper alianzas y, sobre todo, a encontrarnos entre iguales.",
    "Diferentes mesas, distintas personas, una misma pasión por vaciar meeples y sumar puntos.",
    "La diversidad hace que cada partida sea imprevisible; la inclusión, que todos tengamos sitio en la mesa.",
    "Abrir hueco en la mesa es la mejor jugada que podemos hacer en toda la tarde.",
    "No buscamos perfiles perfectos, solo gente dispuesta a reírse, perder y volver a empezar.",
    "Las fichas son de colores distintos, pero las risas alrededor de la mesa son de todos.",
    "Mesa abierta, mazo barajado y cero exclusiones: que empiece la partida.",
    "Jugar en compañía es el único tablero donde la victoria real es que nadie juegue solo.",
    "Estrategias infinitas y espacios donde cabe todo el mundo sin pedir permiso.",
    "Da igual tu nivel, tu ritmo o tu mazo: aquí el único requisito es sentarse a compartir.",
    "Menos postureo y más tardes de tablero compartidas con quien se quiera apuntar.",
    "El azar decide los dados, pero que todo el mundo sea bienvenido depende de nosotros.",
    "Una comunidad real no se construye con discursos, sino compartiendo mesa y cartas cada semana.",
    "Las mejores partidas son aquellas donde caben todas las formas de ser y de jugar.",
    "Un tablero sobre la mesa y un espacio seguro para ser uno mismo sin filtros.",
    "No venimos a cambiar el mundo, venimos a cambiar el mundo de turno en turno.",
    "Aquí la única norma inquebrantable es que hay sitio para todos los que quieran jugar.",
    "Ganes o pierdas, lo importante es que el asiento de al lado nunca esté vacío.",
    "Aquí las únicas barreras que tiramos abajo son las que separan un juego difícil.",
    "No hay rivales pequeños ni personas excluidas cuando el objetivo es echar unas risas.",
    "Barajar cartas une más que cualquier manual de instrucciones.",
    "Un espacio donde cada perfil suma una táctica nueva a la partida.",
    "La verdadera victoria cooperativa es que nadie se sienta invisible en el grupo.",
    "Tirar los dados con libertad es la mejor forma de empezar la semana.",
    "Mesa larga, opiniones diversas y sitio para cualquier formato de jugador.",
    "La estrategia más compleja de la tarde es conseguir que todo el mundo encaje.",
    "Aquí las fichas se mueven solas, pero las conexiones las creamos nosotros.",
    "Tan válidos son los dados de seis caras como las formas de ser de cada uno.",
    "Un buen grupo de juego se nota en que los dados nunca discriminan a nadie.",
    "Menos normas absurdas y más ganas de compartir tablero sin prejuicios.",
    "Da igual si juegas al rol, al eurogame o al party; lo importante es estar a gusto.",
    "La diversidad de opiniones es el mejor motor para decidir qué juego sacamos.",
    "Un espacio abierto donde las únicas discusiones sanas ocurren sobre el tablero.",
    "Acercar una silla y hacer sitio es la seña de identidad de cualquier buena mesa.",
    "El azar reparte las cartas, pero el respeto mutuo lo ponemos nosotros.",
    "Jugar en comunidad significa que siempre hay alguien dispuesto a explicarte las reglas.",
    "No hace falta ganar para disfrutar de una tarde redonda rodeado de gente maja.",
    "Las mejores alianzas se forman entre personas que no se conocían de nada.",
    "Un tablero despliega infinitas opciones; nuestra comunidad también.",
    "Aquí caben todos los puntos de vista, las risas flojas y los fallos de cálculo.",
    "Compartir mesa es el puente más corto para dejar atrás cualquier diferencia.",
    "Los dados caen donde quieren, pero el compañerismo lo decidimos nosotros.",
    "Un espacio seguro donde la única presión es decidir qué expansión jugamos.",
    "La mesa de juego es el punto de encuentro perfecto para cualquier formato de persona.",
    "Estrategia, azar y cero postureo: los ingredientes de una tarde inolvidable.",
    "Celebrar la variedad de formas de jugar es lo que hace grande a este grupo.",
    "Abre el manual, busca una silla libre y forma parte de la partida."
];

function cargarFraseAleatoria() {
    const indiceAleatorio = Math.floor(Math.random() * frasesJuegos.length);
    const elementoBlockquote = document.getElementById("fraseDinamica");
    if (elementoBlockquote) {
        elementoBlockquote.textContent = `"${frasesJuegos[indiceAleatorio]}"`;
    }
}

function actualizarRelojCabecera() {
    const ahora = new Date();
    const textoFecha = ahora.toLocaleDateString("es-ES", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });
    const textoHora = ahora.toLocaleTimeString("es-ES", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    const fechaCapitalizada = textoFecha.charAt(0).toUpperCase() + textoFecha.slice(1);
    const elFecha = document.getElementById("fechaHoy");
    if(elFecha) elFecha.textContent = `${fechaCapitalizada} — ${textoHora}`;
}

document.addEventListener("DOMContentLoaded", () => {
    cargarFraseAleatoria();
    actualizarRelojCabecera();
    setInterval(actualizarRelojCabecera, 1000);

    const container = document.getElementById("floating-games-container");
    const gameEmotes = ["🎲", "♟️", "👑", "♞", "🃏", "🎯", "🧩", "🦄", "🌈"];

    function spawnGameItem() {
        const item = document.createElement("div");
        item.classList.add("floating-game-item");
        item.textContent = gameEmotes[Math.floor(Math.random() * gameEmotes.length)];

        const fromLeft = Math.random() < 0.5;
        const startX = fromLeft ? -50 : window.innerWidth + 50;
        const endX = fromLeft ? window.innerWidth + 50 : -50;

        const startY = Math.random() * window.innerHeight;
        const endY = startY + (Math.random() * 200 - 100);

        const rotation = (Math.random() - 0.5) * 720;
        const duration = 6 + Math.random() * 6;

        item.style.setProperty("--start-x", startX + "px");
        item.style.setProperty("--start-y", startY + "px");
        item.style.setProperty("--end-x", endX + "px");
        item.style.setProperty("--end-y", endY + "px");
        item.style.setProperty("--rotacion", rotation + "deg");
        item.style.animation = `lanzarDeLadoALado ${duration}s linear forwards`;

        container.appendChild(item);

        setTimeout(() => {
            item.remove();
        }, duration * 1000);
    }

    setInterval(spawnGameItem, 1500);

    for(let i = 0; i < 4; i++) {
        setTimeout(spawnGameItem, i * 400);
    }
});
</script>

</body>
</html>
